<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TemreOS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Kilit Ekranı -->
    <div class="lock-screen" id="lockScreen">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="status-icons">
                <span class="signal">📶</span>
                <span class="wifi">📡</span>
                <span class="battery">🔋</span>
            </div>
        </div>
        
        <div class="lock-content">
            <h1 class="clock">09:41</h1>
            <div class="date">2 Mart 2025, Pazar</div>
            
            <div class="wallpaper-shape">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
            </div>
            
            <div class="lock-widgets">
                <div class="widget weather-widget">
                    <span class="widget-icon">☀️</span>
                    <div class="widget-info">
                        <span class="widget-label">Hava Durumu</span>
                        <span class="widget-value">24°C</span>
                    </div>
                </div>
                <div class="widget calendar-widget">
                    <span class="widget-icon">📅</span>
                    <div class="widget-info">
                        <span class="widget-label">Takvim</span>
                        <span class="widget-value">Toplantı yok</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="lock-footer">
            <div class="lock-indicator"></div>
            <span class="hint">yukarı kaydır</span>
        </div>
    </div>

    <!-- Ana Ekran -->
    <div class="home-screen" id="homeScreen">
        <div class="status-bar dark">
            <span class="time">9:41</span>
            <div class="status-icons">
                <span class="signal">📶</span>
                <span class="wifi">📡</span>
                <span class="battery">🔋</span>
            </div>
        </div>
        
        <!-- Uygulama Izgarası -->
        <div class="app-grid">
            <!-- Satır 1 -->
            <div class="app-icon" data-app="phone">
                <div class="icon-bg">
                    <span class="icon-emoji">📞</span>
                </div>
                <span class="app-name">Telefon</span>
            </div>
            
            <div class="app-icon" data-app="messages">
                <div class="icon-bg">
                    <span class="icon-emoji">💬</span>
                </div>
                <span class="app-name">Mesajlar</span>
            </div>
            
            <div class="app-icon" data-app="chrome">
                <div class="icon-bg">
                    <span class="icon-emoji">🌐</span>
                </div>
                <span class="app-name">Chrome</span>
            </div>
            
            <div class="app-icon" data-app="camera">
                <div class="icon-bg">
                    <span class="icon-emoji">📷</span>
                </div>
                <span class="app-name">Kamera</span>
            </div>
            
            <!-- Satır 2 -->
            <div class="app-icon" data-app="termux">
                <div class="icon-bg termux-bg">
                    <span class="icon-emoji">⌨️</span>
                </div>
                <span class="app-name">Termux</span>
            </div>
            
            <div class="app-icon" data-app="nvidia">
                <div class="icon-bg nvidia-bg">
                    <span class="icon-emoji">🎮</span>
                </div>
                <span class="app-name">Nvidia</span>
            </div>
            
            <div class="app-icon" data-app="zarchiver">
                <div class="icon-bg zarchiver-bg">
                    <span class="icon-emoji">📦</span>
                </div>
                <span class="app-name">ZArchiver</span>
            </div>
            
            <div class="app-icon" data-app="spotify">
                <div class="icon-bg spotify-bg">
                    <span class="icon-emoji">🎵</span>
                </div>
                <span class="app-name">Spotify</span>
            </div>
            
            <!-- Satır 3 -->
            <div class="app-icon" data-app="whatsapp">
                <div class="icon-bg whatsapp-bg">
                    <span class="icon-emoji">💚</span>
                </div>
                <span class="app-name">WhatsApp</span>
            </div>
            
            <div class="app-icon" data-app="instagram">
                <div class="icon-bg instagram-bg">
                    <span class="icon-emoji">📸</span>
                </div>
                <span class="app-name">Instagram</span>
            </div>
            
            <div class="app-icon" data-app="settings">
                <div class="icon-bg">
                    <span class="icon-emoji">⚙️</span>
                </div>
                <span class="app-name">Ayarlar</span>
            </div>
            
            <div class="app-icon" data-app="files">
                <div class="icon-bg">
                    <span class="icon-emoji">📁</span>
                </div>
                <span class="app-name">Dosyalar</span>
            </div>
        </div>
        
        <!-- Dock -->
        <div class="dock">
            <div class="app-icon" data-app="phone">
                <div class="icon-bg">
                    <span class="icon-emoji">📞</span>
                </div>
            </div>
            
            <div class="app-icon" data-app="messages">
                <div class="icon-bg">
                    <span class="icon-emoji">💬</span>
                </div>
            </div>
            
            <div class="app-icon" data-app="chrome">
                <div class="icon-bg">
                    <span class="icon-emoji">🌐</span>
                </div>
            </div>
            
            <div class="app-icon" data-app="camera">
                <div class="icon-bg">
                    <span class="icon-emoji">📷</span>
                </div>
            </div>
        </div>
        
        <!-- Sayfa İndikatörü -->
        <div class="page-indicator">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
    </html>
